<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ emp.name }} — Employee Directory</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1e1e2e;
      --accent: #00e5a0;
      --accent-dim: rgba(0, 229, 160, 0.08);
      --text: #e8e8f0;
      --muted: #6b6b80;
      --danger: #ff4d6d;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 28px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10,10,15,0.92);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .logo span { color: var(--accent); }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--accent); }

    main { max-width: 680px; margin: 0 auto; padding: 60px 48px; }

    .profile-header {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 40px;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--border);
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: var(--accent-dim);
      border: 1px solid rgba(0,229,160,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.8rem;
      color: var(--accent);
      flex-shrink: 0;
    }

    .profile-info h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.9rem;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .profile-info .role { color: var(--muted); font-size: 0.95rem; margin-bottom: 10px; }

    .dept-tag {
      display: inline-block;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 6px;
    }

    .detail-grid {
      display: grid;
      gap: 16px;
      margin-bottom: 40px;
    }

    .detail-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    .detail-value {
      font-size: 0.92rem;
      color: var(--text);
      font-weight: 400;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 11px 24px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    .btn-danger {
      background: rgba(255,77,109,0.1);
      color: var(--danger);
      border: 1px solid rgba(255,77,109,0.3);
    }

    .btn-danger:hover { background: rgba(255,77,109,0.2); }
  </style>
</head>
<body>
  <header>
    <div class="logo">emp<span>.</span>directory</div>
    <a href="/" class="back-link">← Back to directory</a>
  </header>

  <main>
    <div class="profile-header">
      <div class="avatar">{{ emp.name[0] }}</div>
      <div class="profile-info">
        <h1>{{ emp.name }}</h1>
        <div class="role">{{ emp.role }}</div>
        <div class="dept-tag">{{ emp.department }}</div>
      </div>
    </div>

    <div class="detail-grid">
      <div class="detail-row">
        <span class="detail-label">Email</span>
        <span class="detail-value">{{ emp.email }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Department</span>
        <span class="detail-value">{{ emp.department }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Role</span>
        <span class="detail-value">{{ emp.role }}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Member since</span>
        <span class="detail-value">{{ emp.created_at.strftime('%B %d, %Y') }}</span>
      </div>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-outline">← Back</a>
      <form action="/delete/{{ emp.id }}" method="POST" onsubmit="return confirm('Delete {{ emp.name }}?')">
        <button type="submit" class="btn btn-danger">Delete Employee</button>
      </form>
    </div>
  </main>
</body>
</html>

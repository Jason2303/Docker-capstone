services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: employeedb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d employeedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./flask-app
    environment:
      DB_HOST: db
      DB_NAME: employeedb
      DB_USER: admin
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # Flask is NOT exposed to the host — only Nginx can reach it

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
